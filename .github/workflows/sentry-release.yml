name: Create a release on Sentry

# This workflows creates a new release on Sentry
#
# This is effectively just letting Sentry know that this version
# might appear in the future error reports (nothing happens if they don't).

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      auth-token:
        required: true
      # The legacy form of the three below. Only auth-token is really a secret;
      # url and organization are an org slug and a public hostname, and masking
      # them hides the project in a failing release. Drop these three once no
      # caller passes them.
      url:
        required: false
      organization:
        required: false
      project:
        required: false


jobs:
  create-sentry-release:
    name: Create release on Sentry
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full-depth)
        uses: actions/checkout@v2
        with: { fetch-depth: 0 } # Required for auto-commits
      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          # vars resolves against the CALLING repository, so the org-level
          # SENTRY_URL and SENTRY_ORG arrive without the caller passing
          # anything. The secrets are the fallback until they are removed.
          SENTRY_URL: ${{ vars.SENTRY_URL || secrets.url }}
          SENTRY_AUTH_TOKEN: ${{ secrets.auth-token }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.organization }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.project }}
        with:
          version: ${{ inputs.version }}
          ignore_missing: true
          ignore_empty: true
